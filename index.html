<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>탑 후픽 추천받아요</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { 
            font-family: sans-serif; 
            max-width: 800px; 
            margin: 20px auto; 
            padding: 20px; 
            line-height: 1.6; 
            background-color: #121212; 
            color: #e0e0e0; 
        }
        h1 { color: #ffffff; text-align: center; margin-bottom: 30px; }
        input { 
            width: 100%; 
            padding: 15px; 
            font-size: 1.2em; 
            border: 2px solid #333; 
            border-radius: 8px; 
            box-sizing: border-box; 
            background-color: #1e1e1e; 
            color: #ffffff; 
            margin-bottom: 20px;
            outline: none;
        }
        input:focus { border-color: #03dac6; }
        
        .ad-label { color:white; background-color:#cc4b4b; padding:6px 10px; border-radius:4px; font-weight:bold; display:inline-block; min-width: 100px; text-align: center; }
        .ap-label { color:white; background-color:#34678b; padding:6px 10px; border-radius:4px; font-weight:bold; display:inline-block; min-width: 100px; text-align: center; }
        
        .enemy-header { font-size: 1.8em; font-weight: bold; margin-top: 30px; color: #bb86fc; }
        .enemy-sub { font-size: 0.7em; color: #b0b0b0; font-weight: normal; margin-left: 10px; }
        
        .star-row { 
            margin: 15px 0; 
            display: flex; 
            align-items: center; 
            background: #1d1d1d; 
            padding: 10px; 
            border-radius: 6px; 
        }
        .stars { 
            color: #ffd700; 
            margin-left: 20px; 
            letter-spacing: 2px; 
            font-size: 1.3em; 
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.6); /* 별에서 빛나게 효과 */
        }
        
        hr { border: 0; border-top: 1px solid #333; margin: 40px 0; }
        h3 { color: #03dac6; border-left: 5px solid #03dac6; padding-left: 15px; margin-top: 50px; }
    </style>
</head>
<body>

<h1>TOP COUNTER PICKER</h1>
<input type="text" id="enemyInput" placeholder="상대 챔피언 입력 (예: 가렌 다리우스 ㄹㄴㅌ)" autocomplete="off">
<div id="results"></div>

<script>
// [데이터 설정]
const my_champions = {
    "AD": ["가렌", "다리우스", "나서스", "베인", "세트", "스카너", "암베사", "우르곳", "이렐리아", "일라오이", "자르반", "잭스"],
    "AP": ["그웬", "라이즈", "럼블", "말파이트", "모데카이저", "바루스", "브랜드", "신지드", "에코", "오로라", "케넨", "티모"]
};
const my_full_pool = [...my_champions.AD, ...my_champions.AP];

const enemy_champions = [   
    "가렌", "갱플랭크", "그라가스", "그웬", "나르", "나서스", "다리우스", "라이즈", "럼블", "레넥톤", "렝가", "리븐",
    "마오카이", "말파이트", "모데카이저", "문도", "바루스", "베인", "볼리베어", "블라디미르", "뽀삐", "사이온", "사일러스",
    "세주아니", "세트", "쉔", "스웨인", "스카너", "신지드", "신짜오", "아칼리", "아트록스", "암베사", "애니비아", "야스오",
    "오공", "오로라", "오른", "올라프", "요네", "요릭", "우디르", "우르곳", "워윅", "이렐리아", "일라오이", "자크", "자헨",
    "잭스", "제이스", "초가스", "카밀", "카시오페아", "케넨", "케일", "퀸", "크산테", "클레드", "탐켄치", "트런들",
    "트린다미어", "티모", "판테온", "피오라", "하이머딩거", "나피리", "녹턴", "니달리", "렉사이", "룰루", "리신", "비에고",
    "쉬바나", "스몰더", "아크샨", "제드", "카르마", "카이사", "트페", "피들스틱"
];

let banData = {}; 
let preference = {}; 

Papa.parse("banData - 시트1.csv", {
    download: true,
    header: false, 
    complete: function(results) {
        const data = results.data;
        if (!data || data.length === 0) return;
        const headers = data[0].map(h => h ? h.trim() : "");
        for (let i = 1; i < data.length; i++) {
            const row = data[i];
            const enemyName = row[0] ? row[0].trim() : "";
            if (!enemyName) continue;
            if (enemyName === "선호도") {
                my_full_pool.forEach(name => {
                    const idx = headers.indexOf(name);
                    if (idx !== -1) preference[name] = parseFloat(row[idx]) || 1.0;
                });
            } else {
                banData[enemyName] = {};
                my_full_pool.forEach(name => {
                    const idx = headers.indexOf(name);
                    if (idx !== -1) banData[enemyName][name] = parseFloat(row[idx]) || 0;
                });
            }
        }
    }
});

// [핵심: 별점 뻥튀기 로직]
function getStarString(score, isCommon = false) {
    if (score <= 0) return "";
    
    // 가중치를 대폭 늘림 (단일 추천은 최대 별 7개 타겟, 공통은 최대 5개 타겟)
    let max_stars_weight = isCommon ? 4.0 : 6.0; 
    
    // 파이썬 공식 적용: round((점수-1)/(3-1) * 가중치) + 1
    // 점수가 3점 만점이고 선호도가 1.2면 score가 3.6까지 나올 수 있음
    let starCount = Math.round(((score - 1) / (3 - 1)) * max_stars_weight) + 1;
    
    // 최소 1개, 최대 8개까지 제한
    starCount = Math.max(1, Math.min(8, starCount));
    
    return "★".repeat(starCount);
}

function resolve_input(user_input) {
    const CHOSUNG_LIST = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
    user_input = user_input.trim();
    if (!user_input) return null;
    if (enemy_champions.includes(user_input)) return user_input;
    const get_chosung = (word) => {
        let res = "";
        for (let char of word) {
            if (char >= "가" && char <= "힣") {
                let code = char.charCodeAt(0) - 44032;
                res += CHOSUNG_LIST[Math.floor(code / 588)];
            } else res += char;
        }
        return res;
    };
    for (let champ of enemy_champions) {
        if (get_chosung(champ) === user_input) return champ;
    }
    return null;
}

const inputEl = document.getElementById('enemyInput');
const resultEl = document.getElementById('results');

inputEl.addEventListener('input', (e) => {
    const raw_inputs = e.target.value.split(/\s+/).filter(x => x.trim());
    let enemies = [];
    raw_inputs.forEach(r => {
        let resolved = resolve_input(r);
        if (resolved) enemies.push(resolved);
    });

    if (enemies.length === 0) { resultEl.innerHTML = ""; return; }
    
    let html = "";
    enemies.forEach(e => {
        html += `<div class="enemy-header">${e} <span class="enemy-sub">상대 추천 리스트</span></div>`;
        let matchUps = banData[e];
        if (!matchUps) {
            html += "<div>데이터 없음</div>";
        } else {
            let scores = [];
            my_full_pool.forEach(name => {
                let base = matchUps[name] || 0;
                if (base > 0) {
                    let final = base * (preference[name] || 1.0);
                    scores.push({ name, final });
                }
            });
            scores.sort((a, b) => b.final - a.final);
            scores.slice(0, 5).forEach(item => {
                const labelClass = my_champions.AD.includes(item.name) ? "ad-label" : "ap-label";
                html += `<div class="star-row">
                            <span class="${labelClass}">${item.name}</span>
                            <span class="stars">${getStarString(item.final, false)}</span>
                         </div>`;
            });
        }
    });

    if (enemies.length > 1) {
        html += "<hr><h3>공통 카운터 (교집합)</h3>";
        let common = [];
        my_full_pool.forEach(name => {
            let sum = 0; let possible = true;
            for (let e of enemies) {
                let s = banData[e]?.[name] || 0;
                if (s <= 0) { possible = false; break; }
                sum += s;
            }
            if (possible) {
                let avg = sum / enemies.length;
                let final = avg * (preference[name] || 1.0);
                common.push({ name, final });
            }
        });
        common.sort((a, b) => b.final - a.final);
        common.slice(0, 5).forEach(item => {
            const labelClass = my_champions.AD.includes(item.name) ? "ad-label" : "ap-label";
            html += `<div class="star-row">
                        <span class="${labelClass}">${item.name}</span>
                        <span class="stars">${getStarString(item.final, true)}</span>
                     </div>`;
        });
    }
    resultEl.innerHTML = html;
});
</script>
</body>
</html>
