<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>탑 후픽 추천받아요</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 20px; background-color: #121212; color: #ffffff; }
        input { width: 100%; padding: 12px; background-color: #1e1e1e; color: #ffffff; border: 1px solid #333; border-radius: 4px; box-sizing: border-box; }
        .name-wrapper { display: inline-block; width: 110px; margin-right: 15px; vertical-align: middle; }
        .warning { color: #ff6b6b; margin: 10px 0; font-weight: bold; }
        .enemy-header { font-size: 1.6em; font-weight: bold; margin-top: 30px; color: #ffffff; }
        .enemy-sub { font-size: 0.6em; color: #888888; margin-left: 5px; }
        .stars { color: #ffd700; letter-spacing: 2px; font-size: 1.2em; vertical-align: middle; }
        .result-row { margin: 12px 0; display: block; }
        hr { border: 0; border-top: 1px solid #444; margin: 30px 0; }
        h2 { font-size: 1.5em; color: #ffffff; }
    </style>
</head>
<body>

<h1>탑 후픽 추천받아요</h1>
<input type="text" id="enemyInput" placeholder="예: 가렌 다리우스 ㄹㄴㅌ" autocomplete="off">
<div id="warningArea" class="warning"></div>
<div id="results"></div>

<script>
// =============================================================================================
// 1. 챔피언 데이터
// =============================================================================================
const my_champions = {
    "AD": ["가렌", "다리우스", "나서스", "베인", "세트", "스카너", "암베사", "우르곳", "이렐리아", "일라오이", "자르반", "잭스"],
    "AP": ["그웬", "라이즈", "럼블", "말파이트", "모데카이저", "바루스", "브랜드", "신지드", "에코", "오로라", "케넨", "티모"]
};
const my_full_pool = [...my_champions.AD, ...my_champions.AP];

//상대 챔수: 
//내ad 후보: 나피리, 올라프, 바이
//내ap 후보: 블라디, 카이사, 트페
//새챔 후보: 
//비주류 후보: 

const enemy_champions = [   
    "가렌", "갱플랭크", "그라가스", "그웬", "나르", "나서스", "다리우스", "라이즈", "럼블", "레넥톤", "렝가", "리븐",
    "마오카이", "말파이트", "모데카이저", "문도", "바루스", "베인", "볼리베어", "블라디미르", "뽀삐", "사이온", "사일러스",
    "세주아니", "세트", "쉔", "스웨인", "스카너", "신지드", "신짜오", "아칼리", "아트록스", "암베사", "애니비아", "야스오",
    "오공", "오로라", "오른", "올라프", "요네", "요릭", "우디르", "우르곳", "워윅", "이렐리아", "일라오이", "자크", "자헨",
    "잭스", "제이스", "초가스", "카밀", "카시오페아", "케넨", "케일", "퀸", "크산테", "클레드", "탐켄치", "트런들",
    "트린다미어", "티모", "판테온", "피오라", "하이머딩거", "나피리", "녹턴", "니달리", "렉사이", "룰루", "리신", "비에고",
    "쉬바나", "스몰더", "아크샨", "제드", "카르마", "카이사", "트페", "피들스틱"
];

let banData = {};
let preference = {}; 

Papa.parse("banData - 시트1.csv", {
    download: true,
    complete: function(results) {
        const data = results.data;
        if (!data || data.length < 1) return;
        const headers = data[0].map(h => h ? h.trim() : "");

        for (let i = 1; i < data.length; i++) {
            const firstCol = data[i][0] ? data[i][0].trim() : "";
            if (firstCol.includes("선호도")) {
                my_full_pool.forEach(name => {
                    const idx = headers.indexOf(name);
                    if (idx !== -1) {
                        let val = parseFloat(data[i][idx]);
                        preference[name] = isNaN(val) ? 1.0 : val;
                    }
                });
            }
        }

        for (let i = 1; i < data.length; i++) {
            const row = data[i];
            const firstCol = row[0] ? row[0].trim() : "";
            if (enemy_champions.includes(firstCol)) {
                banData[firstCol] = {};
                my_full_pool.forEach(name => {
                    const idx = headers.indexOf(name);
                    if (idx !== -1) {
                        let val = parseFloat(row[idx]);
                        if (!isNaN(val)) banData[firstCol][name] = val;
                    }
                });
            }
        }
    }
});

// =============================================================================================
// 2. 초성 변환
// =============================================================================================
const CHOSUNG_LIST = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
function get_chosung(word) {
    let res = "";
    for (let char of word) {
        if (char >= "가" && char <= "힣") {
            let code = char.charCodeAt(0) - 44032;
            res += CHOSUNG_LIST[Math.floor(code / 588)];
        } else res += char;
    }
    return res;
}

// =============================================================================================
// 3. 입력 처리
// =============================================================================================
function resolve_input(user_input) {
    user_input = user_input.trim();
    if (!user_input) return null;
    if (enemy_champions.includes(user_input)) return user_input;
    for (let champ of enemy_champions) {
        if (get_chosung(champ) === user_input) return champ;
    }
    return null;
}

// =============================================================================================
// 4. 별점 계산
// =============================================================================================
function score_to_stars(score, max_stars = 2.0) {
    let stars = Math.round(((score - 1) / (5 - 1)) * (max_stars * 3.5)) + 1;
    return "★".repeat(Math.min(5, Math.max(1, stars)));
}

function colorize(champ) {
    const isAD = my_champions.AD.includes(champ);
    const bgColor = isAD ? "#D32F2F" : "#1976D2";
    return `<span style="display: inline-block; width: 80px; background-color: ${bgColor}; color: #ffffff; padding: 4px 10px; border-radius: 4px; font-weight: bold; text-align: center; opacity: 1; visibility: visible;">${champ}</span>`;
}

// =============================================================================================
// 5. 메인 로직 (이벤트 리스너)
// =============================================================================================
const inputEl = document.getElementById('enemyInput');
const resultEl = document.getElementById('results');
const warningEl = document.getElementById('warningArea');

inputEl.addEventListener('input', (e) => {
    const raw_inputs = e.target.value.split(/\s+/).filter(x => x.trim());
    let enemies = [];
    let warnings = [];
    raw_inputs.forEach(r => {
        let resolved = resolve_input(r);
        if (resolved) enemies.push(resolved);
        else warnings.push(`'${r}' 는 제대로 된 이름이 아니에요 ;ㅅ; `);
    });
    warningEl.innerHTML = warnings.join("<br>");
    if (enemies.length === 0) { resultEl.innerHTML = ""; return; }

    let html = "<hr><h2>챔프별 카운터 추천</h2>";
    enemies.forEach(e => {
        html += `<div class="enemy-header">${e} <span class="enemy-sub">에게는요...</span></div>`;
        let matchUps = banData[e];
        if (matchUps) {
            let scores = [];
            my_full_pool.forEach(name => {
                let base = matchUps[name];
                if (base > 0) {
                    let pref = preference[name] || 1.0;
                    let final = base * pref; 
                    scores.push({ name, final, pref });
                }
            });
            
            // 1순위: 최종 점수 내림차순, 2순위: 선호도 내림차순 정렬
            scores.sort((a, b) => {
                if (b.final !== a.final) return b.final - a.final;
                return b.pref - a.pref;
            });
            
            scores.slice(0, 5).forEach(item => {
                html += `<div class="result-row">
                            <span class="name-wrapper">${colorize(item.name)}</span>
                            <span class="stars">${score_to_stars(item.final)}</span>
                         </div>`;
            });
        }
    });

    if (enemies.length > 1) {
        html += "<hr><h2>공통 카운터 추천</h2>";
        let common = [];
        my_full_pool.forEach(name => {
            let sum = 0, count = 0;
            for (let e of enemies) {
                if (banData[e]?.[name]) { sum += banData[e][name]; count++; }
            }
            if (count === enemies.length) {
                let avg = sum / count;
                let pref = preference[name] || 1.0;
                let final = avg * pref;
                common.push({ name, final, pref });
            }
        });
        
        // 공통 추천도 정렬 로직 동일하게 적용
        common.sort((a, b) => {
            if (b.final !== a.final) return b.final - a.final;
            return b.pref - a.pref;
        });
        
        common.slice(0, 5).forEach(item => {
            html += `<div class="result-row">
                        <span class="name-wrapper">${colorize(item.name)}</span>
                        <span class="stars">${score_to_stars(item.final, 0.9)}</span>
                     </div>`;
        });
    }
    resultEl.innerHTML = html;
});
</script>
</body>
</html>
